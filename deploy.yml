name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject TDX credentials
        run: |
          sed -i "s/YOUR_GITHUB_TDX_CLIENT_ID/${{ secrets.TDX_CLIENT_ID }}/g" index.html
          sed -i "s/YOUR_GITHUB_TDX_CLIENT_SECRET/${{ secrets.TDX_CLIENT_SECRET }}/g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .